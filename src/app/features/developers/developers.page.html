<!-- src/app/features/developers/developers.page.html -->
<!-- Five-orites Scoop — Team Credits Page -->

<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button aria-label="Open navigation menu"></ion-menu-button>
    </ion-buttons>
    <ion-title>The Team</ion-title>
    <ion-buttons slot="end">
      <app-cart-button></app-cart-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen>
  <!--
    Hero, with an illustration of the vendor.

    This page had exactly one image and it was a 48px users glyph on a gradient,
    which said "a list of people is below" and nothing about the product. The
    artwork is an authored SVG rather than a generated raster: it is ~2KB, it
    scales to any viewport, it is themed from the same tokens as the rest of the
    app, and it has an alt text and a role so it is announced rather than
    decorative-blind.
  -->
  <div class="dev-hero">
    <div class="dev-hero-art">
      <svg
        class="vendor-art"
        viewBox="0 0 320 200"
        role="img"
        aria-label="Illustration of an ice cream vendor serving a customer from a cart"
      >
        <defs>
          <linearGradient id="dv-sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#e4f1f8" />
            <stop offset="100%" stop-color="#f7fcfe" />
          </linearGradient>
        </defs>

        <rect width="320" height="200" fill="url(#dv-sky)" />
        <rect y="172" width="320" height="28" fill="#e8eef9" />

        <!-- distant awnings, for depth -->
        <g opacity="0.4">
          <rect x="8" y="42" width="52" height="14" rx="3" fill="#8ecae6" />
          <rect x="260" y="42" width="52" height="14" rx="3" fill="#8ecae6" />
        </g>

        <!-- the cart -->
        <g>
          <rect x="150" y="112" width="96" height="46" rx="5" fill="#ffffff" stroke="#1b5e7e" stroke-width="2.5" />
          <!-- mint canopy with a scalloped edge -->
          <path
            d="M144 112h108a4 4 0 0 1 4 4v6H140v-6a4 4 0 0 1 4-4z"
            fill="#5fd9b4"
            stroke="#1b5e7e"
            stroke-width="2"
          />
          <g fill="#ffffff" opacity="0.9">
            <circle cx="158" cy="126" r="4" />
            <circle cx="176" cy="126" r="4" />
            <circle cx="194" cy="126" r="4" />
            <circle cx="212" cy="126" r="4" />
            <circle cx="230" cy="126" r="4" />
          </g>
          <path d="M140 122h116" stroke="#1b5e7e" stroke-width="1.5" opacity="0.35" />
          <!-- wheels -->
          <circle cx="172" cy="164" r="9" fill="#3d2b45" />
          <circle cx="172" cy="164" r="3.5" fill="#f4fbfe" />
          <circle cx="224" cy="164" r="9" fill="#3d2b45" />
          <circle cx="224" cy="164" r="3.5" fill="#f4fbfe" />
          <!-- handle -->
          <path
            d="M246 128h14a6 6 0 0 1 6 6v14"
            stroke="#1b5e7e"
            stroke-width="2.5"
            fill="none"
            stroke-linecap="round"
          />
        </g>

        <!-- the vendor, behind the cart -->
        <g>
          <circle cx="198" cy="72" r="17" fill="#f6d9bd" />
          <!-- cap -->
          <path d="M181 68a17 17 0 0 1 34 0z" fill="#1b5e7e" />
          <rect x="178" y="66" width="40" height="5" rx="2.5" fill="#8ecae6" />
          <!-- apron -->
          <path d="M180 96h36v34a6 6 0 0 1-6 6h-24a6 6 0 0 1-6-6z" fill="#8ecae6" />
          <path d="M192 96h12v40h-12z" fill="#ffffff" opacity="0.75" />
          <!-- arm handing a cone over -->
          <path d="M180 104l-18 10" stroke="#f6d9bd" stroke-width="7" stroke-linecap="round" />
        </g>

        <!-- the cone being handed over -->
        <g transform="translate(158 108)">
          <path d="M-8 -12h16l-8 17z" fill="#e8c79a" stroke="#1b5e7e" stroke-width="1.5" />
          <circle cx="0" cy="-14" r="6" fill="#ffc53d" stroke="#1b5e7e" stroke-width="1.5" />
        </g>

        <!-- the customer -->
        <g>
          <circle cx="96" cy="82" r="15" fill="#e8c3a0" />
          <path d="M81 79a15 15 0 0 1 30 0z" fill="#5fd9b4" />
          <path d="M82 104h28v30a6 6 0 0 1-6 6H88a6 6 0 0 1-6-6z" fill="#ffc53d" />
          <path d="M110 110l20-8" stroke="#e8c3a0" stroke-width="6.5" stroke-linecap="round" />
        </g>

        <!-- a couple of loose scoops on the counter -->
        <g>
          <circle cx="264" cy="120" r="9" fill="#f8a9be" stroke="#1b5e7e" stroke-width="1.5" />
          <circle cx="282" cy="124" r="7" fill="#8ecae6" stroke="#1b5e7e" stroke-width="1.5" />
        </g>
      </svg>
    </div>

    <h1 class="dev-hero-title">Meet the Developers</h1>
    <p class="dev-hero-sub">The team behind Five-orites Scoop</p>
  </div>

  <!-- Developer Grid -->
  <ion-grid class="dev-grid">
    <ion-row>
      @for (dev of developers; track dev.name) {
        <ion-col size="12" size-md="6" size-lg="4">
          <ion-card class="dev-card">
            <ion-card-content class="dev-card-content">
              <ion-avatar class="dev-avatar" [style.background]="dev.accent">
                <div class="dev-initials">{{ dev.initials }}</div>
              </ion-avatar>

              <div class="dev-info">
                <h2 class="dev-name">{{ dev.name }}</h2>
                <div class="dev-roles">
                  @for (role of dev.roles; track role) {
                    <ion-chip
                      [color]="getRoleColor(role)"
                      class="role-chip"
                      [outline]="getRoleColor(role) === 'medium'"
                    >
                      <ion-label>{{ role }}</ion-label>
                    </ion-chip>
                  }
                </div>
              </div>
            </ion-card-content>
          </ion-card>
        </ion-col>
      }
    </ion-row>
  </ion-grid>

  <!-- Credit -->
  <div class="dev-footer">
    <app-icon name="code" class="footer-icon" />
    <p class="footer-text">Built with Ionic &middot; Angular &middot; Firebase</p>
    <p class="footer-sub">Five-orites Scoop &copy; {{ currentYear }}</p>
  </div>
</ion-content>

<app-footer></app-footer>
