<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Five-orites Scoop</title>
    <base href="/" />
    <meta name="color-scheme" content="light" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!--
      `color-scheme` above is "light" only. It previously said "light dark" while
      the app defined no dark theme, so browsers painted native form controls and
      scrollbars dark against a light cream app. Add "dark" back when a dark
      palette actually exists.

      Web fonts. The app previously used only `-apple-system, 'Helvetica Neue',
      sans-serif`, which resolves to SF Pro / Helvetica / Arial — flat, and on
      Windows there is no system-ui entry so it fell through to Arial. Neither
      the playful brief nor the design direction is served by a default UI face.

      Fredoka (display) is rounded and friendly without being a novelty face.
      Nunito (body) stays legible at the 11-14px sizes used for chips, stock
      badges and order metadata. `display=swap` so text renders immediately in
      the fallback instead of blocking on the network, and only the weights
      actually used are requested — each extra weight is another woff2 against a
      bundle already at 1.55mb.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      JetBrains Mono is here because variables.scss has always declared it as
      --font-mono for order IDs, voucher codes and tracking numbers — and it was
      never actually requested, so every one of those strings silently rendered
      in the Consolas fallback. Two extra weights, two more woff2 files.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=JetBrains+Mono:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap"
    />
    <!--
      Inline SVG favicon. src/favicon.ico is a 0-byte placeholder, so linking it
      either 404s (caught by the SPA rewrite into a 200 with an HTML body) or
      serves an empty file. A data URI issues no request at all and cannot break.
      Recoloured to the new brand: powder bowl, sunny scoop, mint scoop.
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%238ECAE6'/%3E%3Cpath d='M9 15h14l-7 12z' fill='%23FFF9F4'/%3E%3Ccircle cx='12' cy='11' r='4' fill='%23FFC53D'/%3E%3Ccircle cx='20' cy='11' r='4' fill='%235FD9B4'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
